# E9 后端引擎 —— 流程定义（路径）的自动化用例。
#
# 与 cases/e9/workflow_add.yaml 的区别（不是同一个 SPA，也不是同一类任务）：
#   · workflow_add.yaml 是【员工视角】跑一张已有流程的申请（/wui/index.html）；
#   · 本文件是【管理员视角】在后端引擎里搭流程定义（/wui/engine.html）。
#     url 变量 {{ wf_path_list }} 指向 /wui/engine.html#/workflowengine/path/pathSet/pathList，
#     实测把 hash 打进 /wui/index.html 只会渲染出门户首页，两个壳不能互相替代。
#
# 推进方式：先跑通"到达 + 进设计器"这一段，验证元素可控、路径走得通，
# 再往里堆机器人节点、分支、合并点等（图片里的两条大用例）。
version: 1

defaults:
  # 搭流程定义要管理员权限（后端引擎对普通员工不可见）。
  login: admin
  epic: E9-UI自动化
  feature: 流程引擎
  severity: critical
  timeout_s: 420
  max_steps: 25

cases:
  - id: e9-wf-designer-reach
    name: 以管理员进入后端引擎的路径设置页
    tags: [e9, workflow, engine, smoke]
    url: "{{ wf_path_list }}"
    goal: |
      在 E9 后端引擎里打开流程设置页面：
      1. 页面加载后是「路径设置」（流程列表）页面，标题区域能看到「路径设置」字样；
      2. 如果页面还在加载、只显示空白或加载动画，请等待它渲染出内容再判断；
      3. 确认左侧有类型树、右侧有流程名称列表（列名大致是「路径名称 / 对应表单 / 路径类型 / 显示顺序」）；
      4. 到达这个列表页面后即停止，不要点击任何按钮、不要新建或修改任何数据。
    expect_mode: and
    expect:
      # 确定性断言：URL 落在后端引擎的路径设置路由上。
      # 这一条同时证明了"登录成 admin"和"进了后端引擎壳"两件事——
      # 员工工作台是 /wui/index.html，URL 里出现 engine.html 就说明壳对了。
      - type: url_contains
        value: "/wui/engine.html#/workflowengine/path/pathSet/pathList"
      # 确定性断言：页面标题文字。
      - type: text_contains
        value: "路径设置"
      # 确定性断言：列表的列名。用「路径名称」而不是「添 加」之类按钮文字——
      # 实测该页按钮文字带 CJK 空格（"添 加"），逐字抠字面量会误判。
      - type: text_contains
        value: "路径名称"
      # 语义断言：确认看到的是流程名称列表（正面陈述，见 AGENTS.md 断言一节）。
      - type: ai
        desc: 已进入路径设置页
        claim: 页面上显示的是流程（路径）名称列表，并带有新增流程的按钮

  - id: e9-wf-designer-create
    name: 新建流程并进入流转设置界面
    tags: [e9, workflow, engine, design]
    timeout_s: 900
    # 这一条要连穿三层弹窗（添加路径 → 路径类型选择 → 表单名称选择），交互密度远高于普通用例；
    # 中途还会先撞两三次"放大镜已被选择弹窗盖住"的拒绝（这是执行层在正确履职，模型要靠
    # discarded 反馈才脱身）。60 步实测不够用（跑到上限被提前截停），故给到 90。
    max_steps: 90
    url: "{{ wf_path_list }}"
    goal: |
      在 E9 后端「路径设置」里新建一个流程，并进入它的流转设置界面。

      【务必按顺序做完全部六步。特别提醒：「路径类型」和「对应表单」都是必填项，
      缺任何一个，点「保存并进入详细设置」都【不会生效】——对话框不关、页面不动，
      而且【不给任何错误提示】。所以不要靠提示判断有没有填好，要在点保存之前
      先确认这两个字段都已经有值了。】

      1. 页面上是流程名称列表。点右上角的「添加」按钮（按钮文字中间可能带一个空格，按语义找它）；
      2. 弹出「添加路径」对话框后，在「路径名称」里填「UI自动化_{{ run_id }}」
         （{{ run_id }} 是本次运行的时间戳，保证每次运行建出来的流程名字唯一——
         名字够用就行，不要在它上面纠结措辞）；
      3. 「路径类型」现在是空的，必须填：点它右边那个放大镜图标按钮，
         弹出标题是「路径类型」的选择对话框；在对话框下方的结果列表里点中一行
         （**不要去找某个特定名字**，列表已经全部列出来了，任意一行都可以）。
         选中后对话框自己关闭，
         回到「添加路径」对话框；
      4. 「对应表单」左边保持默认的「自定义表单」，右边那个框是空的，必须填：
         点它右边那个放大镜图标按钮，弹出标题是「表单名称」的选择对话框；
         在下方结果列表里点中一行（**不要去找某个特定名字**，任意一行都可以）。
         选中后对话框自己关闭，回到「添加路径」对话框；
      5. 现在两个必填项都有值了。点「保存并进入详细设置」，页面会跳转到这个流程的详情页；
      6. 在详情页顶部的页签里点「流转设置」，等流转设置界面渲染出来——能看到「图形编辑」
         「节点信息」「出口信息」这几个页签，以及一个「编辑」按钮。到达这里后停止。
    expect_mode: and
    expect:
      # 确定性断言：URL 落在流转设置（图形编辑）路由上。
      # 这一条同时证明了"流程真的建出来了"——路由里带着 workflowId。
      - type: url_contains
        value: "/wui/engine.html#/workflowengine/path/pathSet/pathDetail/flowSet/pictureEdit"
      # 确定性断言：流转设置的页签文字。
      - type: text_contains
        value: "节点信息"
      - type: text_contains
        value: "出口信息"
      # 语义断言：确认站在流转设置界面上，而不是同一个详情页的其它页签
      # （基础设置 / 表单管理 / 高级设置）。
      #
      # 措辞是**量出来的**，不是拍出来的。原来那句是复合句——
      # "显示的是该流程的流转设置界面" + "带有图形编辑区域" + "编辑按钮"——
      # 实测 noul 只有 0.690/0.730（差 0.02 不过 0.75 的阈值）。
      # 拿真实终局页面量了一轮措辞分布（一次性探针，不入库），规律很清楚：
      #   断言【页面身份】的句子一律低分："当前页面是该流程的流转设置界面" 0.240、
      #     "页面显示的是「UI自动化A」这个流程的流转设置界面" 0.400、
      #     "「流转设置」是当前选中的那个页签" **0.100**——页面正文里"流转设置"只是
      #     四个并列页签之一，从文字上根本判不出哪个是选中的，模型只能给低概率；
      #   断言【看得见的具体东西】的一律高分：本句 0.960、"页面上有「编辑」按钮" 0.970、
      #     "页面上有「图形编辑」页签" 0.980。
      # 所以修法是**把话说成看得见的事**，而不是把阈值从 0.75 往下调——
      # 那是把尺子改短。断言内容一件没少（图形编辑 + 编辑按钮都还在）。
      - type: ai
        desc: 已进入流转设置
        claim: 页面上显示着「图形编辑」「节点信息」「出口信息」三个页签和「编辑」按钮

  - id: e9-wf-designer-build-flow1
    name: 建出第一个工作流的六个节点并存盘
    tags: [e9, workflow, engine, design, build]
    # 路径名末尾那个「B」是**有意区分**的：本文件三条用例共用同一个 {{ run_id }}
    # （loader 一次收集只算一次），而 create 与本条**各自都会新建一条流程**——
    # 不加区分，同一次运行就会在服务端留下两条同名流程，
    # 将来任何"按名字精确定位刚建好那条"的断言都会撞上二义性。
    # 编辑器覆盖层实测 1728×864，而它是**居中**覆盖的：窗口宽 W 时覆盖层左上角在
    # ((W-1728)/2, (H-864)/2)。这带来**两个**下限，取大的那个：
    #   · 工具栏最左边的「创建」图标在层内 x≈243（图标中心）→ W > 1242；
    #   · **画布上节点的名字在层内 x≈74**（节点列固定靠左）→ W ≥ 1580。
    # 第二个才是真正的下限，而且吃过亏：1400×900 下节点落成顶层 x≈-90，**在视口外**，
    # 而正文采集只收视口内的文字——模型建了节点却**一个名字都看不见**，数不清建了几个，
    # 建到第 4 个就判 DONE（实测第 17 步停、细看只有 4 个节点）。
    # 窗口开大到 1700 让节点列进视口——这正是人遇到时的做法（把画布挪进视野），
    # 而不是去放宽"只收看得见的文字"这条判据。
    # 也不宜再大：1920 下候选表会膨胀到近 190 条，模型目标概率掉到 0.2、挑不动（那一次 0/8）。
    viewport: [1700, 920]
    # 第一部分（新建流程 + 进流转设置）实测 11 步，第二部分（编辑态 + 连点六次调色板 + 保存）
    # 约 10 步。给到 90 留足纠错余地——中途至少要撞两三次"放大镜已被选择弹窗盖住"的拒绝
    # （执行层在正确履职，模型靠 discarded 反馈脱身）。
    max_steps: 90
    url: "{{ wf_path_list }}"
    goal: |
      在 E9 后端「路径设置」里新建一个流程，然后进它的流转设置，
      在图形编辑器里按顺序建出六个节点并存盘。

      【第一部分：新建流程并进入流转设置】
      【务必按顺序做完。特别提醒：「路径类型」和「对应表单」都是必填项，缺任何一个，
      点「保存并进入详细设置」都【不会生效】——对话框不关、页面不动，而且不给任何提示。】

      1. 点右上角的「添加」按钮（按钮文字中间可能带一个空格，按语义找它）；
      2. 在「路径名称」里填「UI自动化B_{{ run_id }}」；
      3. 「路径类型」是空的，必须填：点它右边那个放大镜图标按钮，弹出「路径类型」选择对话框，
         **对话框下方已经把所有路径类型列出来了，直接点其中一行就行**
         （里面是这台环境的实际数据，**不要去找某个特定名字**，任意一行都可以）。
         选中后对话框自己关闭、回到「添加路径」，
         此时「路径类型」那一栏**已经显示出你选中的名字**了。
         ⚠️ 列表已经在下面了：**不要点「高级搜索」**（那是按名字过滤用的，点了只会把列表收起来），
            **也不要点「取消」**（那会把对话框关掉、退回上一步重来）。
         ⚠️ 看到它有值了就继续，**不要重复点这个放大镜**；
      4. 「对应表单」右边那个框也是空的，必须填：点它右边那个放大镜图标按钮，
         弹出「表单名称」选择对话框，同样在下方结果列表里点中一行
         （同样是这台环境的实际数据，**不要去找某个特定名字**，任意一行都可以）。
         选中后对话框关闭，「对应表单」右边**显示出你选中的表单名**。
         ⚠️ 这里同样**不要点「高级搜索」或「取消」**，直接在列表里点一行；
         ⚠️ 看到它有值了就继续，**不要重复点这个放大镜**；
      5. 两个必填项都有值了，点「保存并进入详细设置」，页面跳到这个流程的详情页；
      6. 在详情页顶部页签里点「流转设置」，进入图形编辑界面。

      【第二部分：在图形编辑器里建节点】
      7. 点画布窗口里的「编辑」按钮进入编辑态。编辑器会加载出一个带工具栏的空白画布；
      8. 工具栏上有一排节点类型图标。**每点一次就落下一个自动命名的节点**，
         不需要拖拽、也不需要再点画布。严格按下面六小步做，**一步一核对**——
         每点完一次，都先看画布上是不是多出了那一行名字，多了才做下一步：

           ① 点「创建」           → 画布上出现「创建1」，此时共 1 个节点
           ② 点「审批」           → 出现「审批2」，共 2 个
           ③ 再点一次「审批」      → 出现「审批3」，共 3 个
           ④ 点「自动处理」        → 出现「自动处理4」，共 4 个
           ⑤ 再点一次「审批」      → 出现「审批5」，共 5 个
           ⑥ 点「归档」           → 出现「归档6」，共 6 个

         ⚠️ 顺序不能乱、不能跳：第 ③ 步和第 ⑤ 步都是「审批」，**要各点一次**。
         ⚠️ 点完没多出节点 → 那一下没点中图标本体，**换一个同名图标再点**，
            不要改点别的类型、也不要重复点「创建」（创建节点只能有一个）。
         ⚠️ 弹出确认对话框就点「取 消」关掉它，然后继续那一小步。
         ⚠️ **必须六个都齐了**（画布上能同时看到 创建1/审批2/审批3/自动处理4/审批5/归档6）
            才往下走；只数出 5 个就说明漏了一次，补点缺的那个类型。
      9. 六个节点都出现之后，点工具栏上的「保存」把流程图存盘；
      10. 存完后停止，不要改节点属性、不要点别的东西。
    expect_mode: and
    expect:
      # 确定性断言：URL 仍在本流程的流转设置（图形编辑）路由上。
      - type: url_contains
        value: "/wui/engine.html#/workflowengine/path/pathSet/pathDetail/flowSet/pictureEdit"
      # 六个节点名逐一断言。**名字是实录的，不是照图片写的**——图片写「机器人4」，
      # 而调色板上这个图标叫「自动处理」，落下来就是「自动处理4」（实测 workflowId=12032）。
      # 图片那个名字说明流程里把节点改过名，而改名属于节点属性，不在本用例范围内。
      - type: text_contains
        value: "创建1"
      - type: text_contains
        value: "审批2"
      - type: text_contains
        value: "审批3"
      - type: text_contains
        value: "自动处理4"
      - type: text_contains
        value: "审批5"
      - type: text_contains
        value: "归档6"
      # 语义断言：断言"看得见的具体东西"，不断言页面身份（见本文件开头那段实测分布）。
      - type: ai
        desc: 画布上已有六个节点
        claim: 图形编辑画布上显示着「创建1」「审批2」「审批3」「自动处理4」「审批5」「归档6」这六个节点