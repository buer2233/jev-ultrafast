    setup: wf-approval2   # R1 停在「审批2」，待办是人员02/03——**不是**人员05
    url: "{{ base_url }}/wui/index.html#/main/workflow/listDoing"
    goal: |
      以**无关人员（人员05）**的身份，打开自己的待办事宜，确认里面**没有**那条流程。

      ⚠️ 【这是一条负向用例】预期结果是**看不到**——权限起作用的表现就是"根本没有入口"。

      1. 打开待办事宜列表，**等列表渲染出来**，这一步可能慢，多等一会儿。
         ⚠️ **左边那一列里任何条目都不要点**（那是筛选器，不是流程实例）；
         **不要点页签**（点它们只会让列表重新加载）。要找的流程在**右边那一列**。
      2. 通读整个列表，确认里面**没有任何一条**流程的标题含
         「{{ wf_request_name }}」。
         ⚠️ 看不到任何流程行时先点「等待」再观察（列表异步渲染），
         但**页面上任何搜索框都不要用**（尤其顶栏那个「请输入关键词搜索」，那是**全站**搜索），
         搜不到 ≠ 不在你的待办里。也不要在结果里瞎点。
         ⚠️ 不要为了"找一找"而翻已办、切换账号，也不要打开任何流程。
      3. 确认列表里**没有**这条流程之后立即停止。

      【完成条件】终局页面是「待办事宜」列表，且列表里找不到这条流程。
    expect_mode: and
    expect:
      # 改写依据（见文件头第 2 条）：源用例 TC07 测的是"人员05 越权调 submitRequest 被拒、
      # 列表数据不变"。UI 上人员05 连这条流程的入口都没有，**不存在可点的越权提交**——
      # 这本身就是权限生效。所以改写成可观测的等价负向：**列表里不出现该流程**。
      - type: url_contains
        value: "/main/workflow/listDoing"
      # 确定性负向：整页可见文本里不该出现这个唯一的实例名。
      # ⚠️ 前提：goal 让模型**先搜索**——筛过之后列表里只剩匹配项，
      #   这条断言才真的在判"它不在"；不筛就是"第一页碰巧没有"，可能恒真。
      # 用 text_not_contains 而不是 element_absent 是有意的：`_find` 是**子串匹配**，
      # 而 E9 的按钮文字实测会带 CJK 空格（「提 交」），写 label: "提交" 会匹配不上
      # → 断言**假通过**。缺东西的断言写错方向是"永远绿"，比永远红更危险。
      - type: text_not_contains
        value: "{{ wf_request_name }}"
      # 语义只正面陈述页面身份（负向措辞实测 ~0.47）——"不在列表里"由上面那条
      # 确定性的 text_not_contains 负责，不要让模型去判否定事实。
      - type: ai
        desc: 当前在待办事宜列表
        claim: 当前页面是待办事宜列表

  # ── TC08 【改写】归档完成后界面上没有提交入口 ─────────────────────────────
  - id: e9-wf-submit-tc08
    name: TC08 归档完成的流程界面上没有提交入口
    tags: [negative]
    # 负向对照按项目规矩设 reruns: 0（nl-case-author 的 eval 强制这条）。
    # ⚠️ 但**别把网络抖动也算到"该重跑"头上**：模型请求的瞬时断连由
    # `model.post_json` 在**传输层**自己重试（3 次 + 退避），见 AGENTS.md。
    # 实测（2026-10-09）一轮里三条死在 "Model connection failed"，那是代理断了 40 分钟，
    # 用例级重跑也救不回来——所以这里不吃掉那条规矩。
    reruns: 0
    login: employee5
    setup: wf-archived    # R1 已归档完成，人员05 是归档节点查看人（同 TC05，见那里的说明）
    url: "{{ base_url }}/wui/index.html#/main/workflow/listDone"
    goal: |
      以归档节点查看人（人员05）的身份，打开那条已归档的流程，
      确认界面上**没有**「提交」这个操作入口。

      ⚠️ 【这是一条负向用例】预期结果是**没有可点的提交按钮**。

      1. 打开已办事宜列表后，**先点一次「等待」再观察**。
         ⚠️ 这个列表是**异步渲染**的：第一次观察常常看不到流程行。
         看到只有搜索框和页签，就**再点一次「等待」**（最多两次）。
         ⚠️ **左边那一列里任何条目都不要点**（那是筛选器：分组、「已归档」
         之类，都不是流程实例）；**不要点页签**（点了只会让列表重新加载）。
         要找的流程在**右边那一列**。
         ⚠️ **页面上任何搜索框都不要用**（尤其顶栏那个「请输入关键词搜索」，
         那是**全站**搜索）——要找的流程就在下面这个列表里。
      2. 在列表里找到标题**与「{{ wf_request_name }}」逐字完全一致**的那条流程，点开它。

         ⚠️ **列表里会同时有名字极像的两类标题，先分清再点**：
         · **系统自动生成的**，形如「UI自动化流程提交-AutoTest001-2026-10-09」
           ——流程名和后半段之间是**连字符 `-`**，别点这种；
         · **要你找的那条**，形如「{{ wf_request_name }}」——它是**纯英文字母开头的**、
           与上面那种中文标题**完全不同**。**只点这一条。**
         ⚠️ 上面那个形状是**变量渲染出来的真实名字**，逐字对上再点。
      3. 打开后**先不要点任何按钮**，先看清楚页面上有哪些操作入口：
         这是一个已经归档完成的流程，页面应该是**查看态**。
      4. 仔细确认页面上**没有**「提交」按钮，也没有「退回」「收回」这类会改变流程状态的操作。
         （页面上可能仍有「关闭」「打印」「查看流程」这类只读操作，那些不算。）
      5. 看清楚之后停止，不要尝试点任何会改变流程状态的按钮。

      【完成条件】停在这条已归档流程的页面上，且页面上没有「提交」按钮。

      【改写依据，与源用例的差异说清楚】源用例 TC08 测的是"人员06 再调 submitRequest
      被接口拒绝"。UI 上**根本没有这个入口**——界面上就不给提交按钮。
      所以这里断言的是"没有入口"这个更强的等价事实：不是"点了被拒"，而是"点不到"。
      ⚠️ 这条断言依赖环境里归档节点的查看人确实无提交权限；
      若实际界面**有**提交按钮，那是配置差异，**如实记录**，不要为了让它通过而改断言。
    expect_mode: and
    expect:
      # 确定性：打开流程后落在表单页壳上（证据见文件头 Req.getMobxUrl）
      - type: url_contains
        value: "static4form"
      # 确定性：这是【已处理】的表单——走过审批的流程才有「流转意见」这一段。
      # 实测：新建表单、以及保存后的草稿页面上都**没有**这三个字，
      # 所以它把"归档完成"和"刚建出来的草稿"分得开。
      - type: text_contains
        value: "流转意见"
      # 确定性负向：归档后右上角整排操作按钮都消失。
      # ⚠️ 写的是 E9 **实际渲染**的「提 交」（两个字之间带 CJK 空格）——
      #    实测该环境的按钮就是这个渲染法（见 TC03 的候选表），归档态页面文本里没有它。
      #    这是"缺东西"的断言，写错方向会**永远绿**，所以下面还有一条语义断言兜底。
      - type: text_not_contains
        value: "提 交"
      # 语义：**只断言看得见的具体东西**，不要断言"没有按钮"。
      # ⚠️ 这里量过（2026-10-09，同一张归档态页面，见 artifacts/probe/measure_claims.py）：
      #   · "当前页面显示的是一条已经归档完成的流程，页面上没有提交按钮"（复合+否定）
      #     → noul **0.280**  ← 初版就是这句，实测 0.33，一直红
      #   · "页面上显示着这条流程的表单和它的流转意见"          → noul **0.940**
      #   · "页面上有「流转意见」这一段"                        → noul **0.970**
      #   · "页面上只有…几个只读页签，没有任何操作按钮"（复合+否定）→ noul **0.220**
      #   · "页面上没有「提 交」按钮"（单纯否定）               → noul **0.700**（差一点）
      # 规律与 AGENTS.md 记的一致：**断言看得见的具体文本 0.94~0.97，
      # 断言"没有什么" 0.22~0.70**。所以否定交给确定性的 text_not_contains 去做。
      - type: ai
        desc: 已归档流程是查看态
        claim: 页面上显示着这条流程的表单和它的流转意见