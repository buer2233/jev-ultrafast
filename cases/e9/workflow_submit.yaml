  # ── TC06 【改写】缺必要内容时不误提交 —— **本环境上跳过** ─────────────────
  #
  # ⚠️ **这条用例的前提在目标环境上不成立，所以跳过。** 理由写在这里，也进报告。
  #
  # 改写的前提是"新建表单里有必填项，不填就提交会被拦住"——2026-09-30 那条实测记录
  # （下面 goal 里还留着）说 E9 表单通常有一个带红色 * 的「密级」必填下拉。
  # 而 2026-10-09 在目标环境上复测：**「密级」默认就是「公开」、「紧急程度」默认「正常」**，
  # 「标题」由系统生成——**什么都不填直接点提交会成功**（表单关闭、建出实例）。
  # 实测轨迹：模型在「流程模板 ↔ 提 交」之间来回 5 轮，每轮都提交成功、每轮都建出一条流程。
  #
  # 为什么不改成别的负向来凑绿：那等于**偷偷换掉这条用例在测什么**。
  # 源用例 TC06 测的是"缺必要内容时系统不误提交"，换成一个别的负向就与源用例无关了。
  # 所以选诚实的那条路：**留着用例、标上 skip、把理由摆在报告里**。
  #
  # 若哪天环境把「密级」的默认值撤掉（或换一条真有必填项且无默认值的路径），
  # 删掉下面那行 `skip:` 就能重新启用——goal 与 expect 都还是原样。
  - id: e9-wf-submit-tc06
    name: TC06 新建流程不填内容直接提交不会成功
    tags: [negative]
    reruns: 0             # 设计上就该"提交不成功"，重跑只是白跑一遍
    skip: >-
      本环境上「密级」「紧急程度」都有默认值、标题由系统生成，什么都不填直接提交**会成功**，
      "不填就被拦住"这个前提不成立（实测 2026-10-09）。留待环境上出现真正无默认值的必填项时启用。
    login: employee1
    setup: none
    url: "{{ base_url }}/wui/index.html#/main/workflow/add"
    goal: |
      以发起人（人员01）的身份，在新建流程表单里**什么都不填就直接点提交**，
      看它会不会被拦住。

      ⚠️ 【这是一条负向用例】预期结果是**提交不成功**——流程不该被建出来。
      所以你要找的是"被拦住了"的证据，而不是"跑通了"。

      1. 打开新建流程页面，等按分组排列的流程名称列表渲染出来。
      2. 在流程列表里找到名字**与「{{ wf_workflow_name }}」逐字完全一致**的那条流程并点击它。
         ⚠️ **这条流程可能不在首屏**：看不到就**向下滚动流程列表一行行往下找**，
         直到看见它为止——不要因为首屏没有就近点一个名字相似的凑数。
         ⚠️ 点的是**流程模板**，不是某个实例的标题。
         ⚠️ 列表里有几百条流程——**名字必须逐字一致**，别挑"含几个字对上了"的。
      3. **表单里的任何字段都不要动**——不要填「标题」、不要填「签字意见」、
         也不要填任何标着必填的项。（「标题」框里可能本来就有一个默认值，
         那也算"没填"，**不要把它清空也不要改它**。）
      4. 找到并点击「提交」按钮（按钮文字中间可能带空格，按语义找它）。
      5. 点完之后**不要立刻下结论**，先看清楚页面上发生了什么：
         · 如果页面给出必填校验提示、或停在表单上不动 → 这就是被拦住了，符合预期；
         · 如果表单页关闭了、跳回了流程列表页 → 说明它没有被拦住，**那也是本用例要记录的事实**。
      6. 无论哪种情况，都在当前页面停止，不要重复点提交、不要补填字段再试一次。

      【这条用例在实测环境里的表现，如实记下来】实测（2026-09-30）E9 表单通常至少有一个
      带红色 * 的必填项（常见的是「密级」这类下拉），不填就点提交时页面顶部会出现
      「密级或保密期限未填写」这类提示、并停在表单上——**那正是本用例要的"被拦住"**。
      看到这种提示就是符合预期，直接停，不要为了"让它成功"去补字段。

      【完成条件】页面停留在**表单页**上（没有成功提交、没有跳转到列表页）。
      停在哪就在哪停，如实反映你看到的。
    expect_mode: and
    expect:
      # 改写依据（见文件头第 2 条）：源用例 TC06 测的是接口层「缺 requestId/workflowId
      # 返回 PARAM_ERROR，且不会误提交任何流程」。UI 上不存在"不带 requestId 提交"
      # 这条路径——表单永远带着一个合法 requestId。所以改写成 UI 可观测的等价负向：
      # **缺必填内容时提交不成功、流程没有被建出来**。断言口径与源用例一致：
      # 只判"没提交成功"，不判具体错误文案（文案是环境相关的）。
      - type: url_contains
        value: "static4form"     # 仍停在表单页壳上（证据见文件头：Req.getMobxUrl）
      # 确定性：表单还开着（「密级」是这张表单上的字段标签）——
      # 提交真生效的话表单会关闭、这个标签就不在了。
      - type: text_contains
        value: "密级"
      # 语义：**只断言看得见的具体东西**（表单 + 两个按钮），不断言"这是哪个页面"。
      #
      # ⚠️ 这里量过两次，别改回去：
      #   · 初版是复合的**页面身份**断言（"页面上仍然是这条流程的表单填写界面，
      #     并且有提示信息说必填项没有填写"）→ noul **0.54**。
      #     AGENTS.md 早量过同一规律：断言页面身份 0.10/0.24/0.40、
      #     断言看得见的具体东西 0.96~0.98。
      #   · 改成"页面上显示着一条提示信息，说必填项没有填写" → noul **0.08**。
      #     这次不是措辞问题：**那条必填提示根本没进"页面可见文本"**。
      #     实测该环境里红框提示是浮层 tooltip，而最终页面文本里只有
      #     「密级」「附件上传目录未设置」这些**内联**文字，没有「未填写」。
      #     也就是说：想断言"必填校验弹了"，当前观测层抓不到它——
      #     这是**观测覆盖的缺口**，不是用例的错。要么补观测，要么就断可见的东西。
      - type: ai
        desc: 表单仍开着、提交没生效
        claim: 页面上显示着这条流程的表单，右上角还有「提 交」和「保 存」两个按钮

