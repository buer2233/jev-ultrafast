# E9「流程提交」自然语言 UI 用例 —— 由 artifacts/【测试】流程提交_测试报告_20260810_232904.xlsx 转换而来。
#
# 源材料是**接口**用例（TC01~TC08），每行一条；本文件保持**一一对应**：TC01~TC08 各一条。
#
# ── 转换时做的关键取舍（读者务必先看这里）────────────────────────────────────
#
# 1. **跨操作者的链条拆成「接口前置 + 单操作者 UI」。**
#    源用例大多是 人员01 建 → 人员02/03 会签 → 人员04/05 审批 → 人员06 归档 的流转链，
#    而本项目的 UI 用例**一条只有一个登录身份**（runner 在起浏览器之前注入一次 cookie，
#    中途不换人）。所以用 `setup:` 声明"这条用例动手之前环境里必须已经有什么"，
#    由 fixture 走**接口**把流程推到该操作者该动手的那个节点；UI 只做该操作者这一次的动作。
#    代价要说清楚：**跨人流转的那一段由接口走通，不是 UI 走通的**。
#
# 2. **TC06 与 TC08 是【改写】，不是直译。** 这两条源用例测的是接口层的行为
#    （缺参返回 PARAM_ERROR、归档后调提交接口被拒），UI 上**没有对应的可点入口**。
#    改写成了 UI 可观测的等价负向，逐条在用例注释里写明改了什么、依据是什么。
#
# 3. 路由与按钮语义是**查 E9 知识图谱**定的（见 .claude/skills/e9-graph-query）：
#      · 待办事宜 #/main/workflow/listDoing、已办事宜 #/main/workflow/listDone
#        —— 证据 src4js/pc4mobx/workflow/index.js 的 WorkflowRoute 路由表；
#      · 表单页壳 /spa/workflow/static4form/index.html
#        —— 证据 src4js/pc/workflow/components/Req.js:301-303 getMobxUrl；
#      · 「保存」与「提交」是两条链路：doSave_nNew 走 src:"save"、
#        doSubmitNoBack 走 src:"submit" —— 证据 src4js/pc/workflow/util/formbtn.js:76-99。
#    **图谱给不了 UI 元素定位**（id/xpath/选择器图上没有），元素由 snapshot.js 现场观测。
#
# 4. **归档那一角由人员05 兼**，环境里没有源用例的「人员06」。
#    实测目标环境上只建了 AutoTest001~005 五个账号（AutoTest006 登录失败、
#    人力资源里也查不到）。所以上面第 8 行那条四个人物的链路，落到本环境是
#    「01 建 → 02/03 会签 → 04/05 审批 → **05 兼归档**」。
#    E9 的归档节点是**自动归档**（不给任何人产生新待办），所以 05 兼这一角
#    不与他在审批3 的职责冲突——TC04 的「人员05 待办不再含 R1」仍然成立。
#    映射收敛在 `e9_setup.ROLE_*`；换环境补出第 6 个账号时改那里 + TC05/TC08 的 login。
#
# 5. **「标题」在新建表单里是只读的——UI 自建的实例只能按系统自动标题认领。**
#    实测（2026-10-09）：三条流程（含内置的「自由流程2」「BYM专用测试」）打开新建表单，
#    「标题」都是**只读的一段文字**，点它不会出现输入框。查图谱得到根因：
#    `formUtil.getFieldCurViewAttr` 里写着"字段放在模板上但**未设置属性**的默认给只读属性"，
#    而那台环境上这个属性没设过，所以**所有**流程的新建表单都这样。
#    后果：TC01/TC02 是 `setup: none`（UI 自己建实例），标题根本不由我们决定，
#    而是系统按 `<路径名>-<登录名>-<日期>` 生成。
#    所以这两条**不能**用 `{{ wf_request_name }}`（我们填的唯一名，压根没进去过），
#    改用 `{{ wf_system_request_name }}`（loader 按同一公式算出来的自动标题）。
#    ⚠️ TC03~TC08 不受影响：它们走 `setup:` 由**接口**建实例，标题想写什么就写什么。
#    若哪天把该字段的属性配成可编辑，这两条可以改回 `{{ wf_request_name }}`（更严格）。
#
# 6. **「保存」不关表单页，「提交」才关——两条用例的收尾因此完全不同。**
#    实测（2026-10-09，同一张表单、同样不填任何字段）：
#      · 点「保存」→ 表单**留在原地**，只是换成"已保存"态：URL 从 `?iscreate=1&…`
#        变成 `?sessionkey=…&requestid=<新 id>&…`，顶部标题从「创建」变「处理」，
#        「提 交」「保 存」「转 发」三个按钮都还在；页面上**没有任何「待办事宜」入口**；
#      · 点「提交」→ 表单**关闭**，浏览器回到带左侧菜单的工作台（`#/main/workflow/add`）。
#    而 agent **没有"后退"动作**（见 AGENTS.md），表单又是在**新标签页**打开的——
#    所以"保存完再回工作台点待办事宜"这条路**走不通**。
#    TC01 因此改成**就断言保存后那个页面**（URL 带 `requestid=` + 页面上有自动标题
#    + 「提 交」按钮还在 = 草稿建出来了且未提交）；TC02 的写法不变（提交后回得到工作台）。
version: 1

defaults:
  epic: E9-UI自动化
  feature: 流程提交
  severity: critical
  timeout_s: 600
  max_steps: 45
  tags: [e9, workflow, submit]

cases:
  # ── TC01 创建流程草稿（未提交）────────────────────────────────────────────
  - id: e9-wf-submit-tc01
    name: TC01 发起人创建流程草稿并停留在创建节点
    tags: [smoke]
    login: employee1
    setup: none          # 从"新建流程"这一步自己开始，没有前置
    url: "{{ base_url }}/wui/index.html#/main/workflow/add"
    goal: |
      以发起人（人员01）的身份新建一个流程，**只保存、不提交**，
      确认这条草稿**已经建出来了**、而且**还没被提交**。

      1. 打开新建流程页面，页面上按分组列出了各种可发起的流程名称。
         如果列表还在加载（只有空白或加载动画），先等它渲染出内容再判断。
      2. 在流程列表里找到名字**与「{{ wf_workflow_name }}」逐字完全一致**的那条流程并点击它。
         ⚠️ **这条流程可能不在首屏**：这个列表按分组排了三百多条，
         你要找的不一定在第一屏。**看不到就向下滚动流程列表，一行行往下找，
         直到看见它为止**——不要因为首屏没有就近点一个名字相似的凑数。
         ⚠️ 点的是**流程模板**（预先搭好的那条路径），不是实例的标题。
         ⚠️ **列表里有几百条流程**，名字相近的很多——**必须逐字对完整**。
         实测（2026-10-09）写"名字含某几个字"时，模型点成了另一条路径，
         整条用例作废（进错了表单）。
         ⚠️ 点错流程整条用例就作废了（点进去的表单不是你要的那张），
         所以点之前先确认名字对得上。
      3. ⚠️ **表单里什么都不要填。** 特别是「标题」——它在这一格里是**只读的一段文字**，
         由系统自动生成（形如「流程名-你的登录名-今天日期」），**不是输入框**。
         不要点它、不要试图清空或改写它：点了不会有任何输入框出现，
         反复试只会白白耗掉步数。（这一条是实测结论，见本文件头的第 5 条取舍。）
      4. 找到并点击「保存」按钮（按钮文字中间可能带空格，按语义找它）。
         ⚠️ 这里是**保存**、不是**提交**：页面上两个按钮都在，
         必须点「保存」——点「提交」会把流程推进到下一个节点，那是 TC02 要测的事，
         点错了这条用例就测不到"草稿"了。
      5. 保存要花一两秒，这期间页面顶部的按钮会变灰、或出现"处理中"之类的提示，
         那都是正常的。**不要因为按钮变灰就以为失败了。**
         ⚠️ **怎么才算保存成功：页面顶部那行字从「流程:创建」变成
         「流程:处理」。** 光看按钮变回可点**不算**。
         如果顶端还是写着「创建」，就**点「等待」再看一次**，
         直到它变成「处理」为止（最多等三四次）。**别急着收工。**
      6. ⚠️ **保存之后表单不会关闭，也不会有「待办事宜」入口**——
         页面会留在**这张表单自己**的新状态上（顶部标题从「创建」变成「处理」）。
         这是正常的，**不要去页面上翻找「待办事宜」**，也**不要重复点保存**。
         你要做的是：确认这个页面上**显示着刚刚那条流程**（看「标题」那一行），
         并且页面上**还有「提 交」按钮**——它还在，就说明这条流程**还没有被提交**，
         正是我们要的草稿状态。
      7. 看清楚之后就停在这里，不要点「提 交」、不要点「转 发」、不要点「保 存」。

      【完成条件】停在保存后的表单页上（顶端已经是「流程:处理」），
      页面上显示着这条流程，并且「提 交」按钮仍在。
    expect_mode: and
    expect:
      # 确定性：实例真的被建出来了。保存前 URL 是 `?iscreate=1&workflowid=…`，
      # 保存后变成 `?sessionkey=…&requestid=<新 id>&…`——`requestid=` 是**新建成功**
      # 的确定性证据（实测 2026-10-09，见文件头第 6 条）。
      # ⚠️ URL 是**异步**换上的：实测有一轮模型点完保存没等就走，URL 还停在
      # `iscreate=1`。所以 goal 里加了"等到顶端变成「流程:处理」"，
      # 并且下面再压一条**不依赖 URL 时序**的确定性证据。
      - type: url_contains
        value: "requestid="
      # 确定性：页面顶端那行字从「流程:创建」变成「流程:处理」。
      # 这是"保存真的落地了"的第二个独立证据——它和 URL 是两条不同的链路，
      # 不会被同一个时序问题一起蒙掉。
      - type: text_contains
        value: "流程:处理"
      # 确定性：页面上出现系统自动生成的标题。
      # 这是**正面的具体字符串**，不是"某某列表里有一条…"那种要模型理解的事实——
      # 页面上真有这串字就是有。
      - type: text_contains
        value: "{{ wf_system_request_name }}"
      # 语义：确认它**还没被提交**——「提 交」按钮还在，就说明流程停在创建节点。
      # 只断言看得见的东西（按钮），不断言"这是哪个页面"（AGENTS.md 量过：
      # 页面身份 0.10~0.40，看得见的具体东西 0.96+）。
      - type: ai
        desc: 草稿已建立且未提交
        claim: 页面上显示着这条流程，并且页面上还有「提 交」和「保 存」两个按钮

  # ── TC02 发起人提交 → 流转到审批2 ──────────────────────────────────────────
  - id: e9-wf-submit-tc02
    name: TC02 发起人提交后流程离开自己的待办
    tags: [smoke]
    login: employee1

    setup: none          # 从「新建流程」这一步自己开始（提交完落回工作台，见下面说明）
    url: "{{ base_url }}/wui/index.html#/main/workflow/add"
    goal: |
      以发起人（人员01）的身份新建一个流程并**提交**它。

      ⚠️ **环境的限制先说清楚，它决定了这条用例能做到哪一步。**
      提交成功后表单会关闭、落回工作台，而**工作台的导航里没有「已办事宜」
      「待办事宜」入口**（实测：左侧只是个 61px 宽的图标条，展开后也只有几个
      自定义门户；全文档里搜不到「待办/已办」四个字）。而 agent **没有「后退」动作**。
      所以「提交完再去已办里确认」这一步**在这台环境上做不到**——这条用例只能
      观察到**提交被接受**为止；「流转到审批2」那一段由前置配方间接覆盖（见末尾）。

      1. 打开新建流程页面，页面上按分组列出了各种可发起的流程名称。
         如果列表还在加载（只有空白或加载动画），先等它渲染出内容再判断。
      2. 在流程列表里找到名字**与「{{ wf_workflow_name }}」逐字完全一致**的那条流程
         并点击它。
         ⚠️ **这条流程可能不在首屏**：这个列表按分组排了几百条，
         看不到就**向下滚动流程列表一行行往下找**，直到看见它为止——
         不要因为首屏没有就近点一个名字相似的凑数。
         ⚠️ **列表里有几百条流程**，名字相近的很多——**必须逐字对完整**。
         实测（2026-10-09）写「名字含某几个字」时，模型点成了另一条路径，
         整条用例作废（进错了表单）。点之前先确认名字一字不差。
      3. ⚠️ **表单里什么都不要填。** 特别是「标题」——它是**只读的一段文字**，
         由系统自动生成，**不是输入框**。不要点它、不要试图改写它。
      4. 找到并点击**「提 交」按钮**（按钮文字中间带一个空格，按语义找它）。
         ⚠️ **按钮在表单的右上角那一排**：「提 交」「保 存」「转 发」三个并排。
         ⚠️ **不要点「批 准」「同 意」这类词**——那是签字意见框旁边的
         **常用批示语**，点它只会往签字意见里填两个字，**流程不会被提交**。
         ⚠️ 必须点「提 交」，**不要点「保 存」**——保存只会留下草稿、表单**不关**，
         这条用例就观察不到「提交被接受」了。
      5. 提交要花一两秒。**成功的话表单页会自己关闭、落回工作台页面**
         （页面上重新出现按分组排列的流程名称列表）。
         ⚠️ **怎么才算提交成功：页面上再也看不到「签字意见」这个字段。**
         只要还能看到它，就说明**提交还没生效**——这时**点「等待」再看**，
         直到它消失为止（最多等三四次）。**别急着收工。**
         实测（2026-10-09）有一轮模型点完提交就走，表单其实还开着。
      6. 确认表单**已经关闭**、当前是那个流程名称列表页面之后停止。
         不要重复点提交、不要做别的操作。

      【完成条件】表单页已关闭，当前是工作台上的流程名称列表。

      【本用例测不到的部分，说清楚】源用例 TC02 的核心是「提交后流转到审批2」。
      那需要观察人员02 的待办，**而一条 UI 用例只有一个登录身份**；
      加上上面那条环境限制（提交后回不到任何列表），UI 这一侧能拿到的证据就是
      **「提交被接受了：表单关闭、没有留在原地」**。
      「确实落到了审批2」由 setup: wf-approval2 那条用例的前置（接口按会签语义推进）
      间接覆盖——那个前置要成功推到审批2，本身就证明提交能把流程推进到审批2。
    expect_mode: and
    expect:
      # 确定性：表单关了 = 提交被接受。
      # 提交**失败**时表单会留在原地不关，那时 URL 仍是 static4form——
      # 所以这一条本身就是「提交成功」的正向证据（TC03 的注释里记着同一条规律）。
      - type: url_contains
        value: "/main/workflow/add"
      # 确定性：表单里的字段标签不该再出现在页面上（列表页没有「签字意见」）。
      # 这是「表单确实关掉了」的第二个独立证据，不依赖 URL 的形状。
      - type: text_not_contains
        value: "签字意见"
      # 语义：正面陈述看得见的具体东西（负向措辞实测只有 ~0.47，见 AGENTS.md）
      - type: ai
        desc: 提交后回到了工作台
        claim: 页面上显示着按分组排列的流程名称列表

# ── TC03 审批2 会签：人员02 提交自己那一份 ────────────────────────────────
  - id: e9-wf-submit-tc03
    name: TC03 审批2会签人员提交后离开自己的待办
    login: employee2
    setup: wf-approval2   # 前置：人员01 已创建并提交，R1 停在「审批2」，人员02/03 有待办
    url: "{{ base_url }}/wui/index.html#/main/workflow/listDoing"
    goal: |
      以会签人员之一（人员02）的身份，处理自己待办里的那条流程。

      1. 打开待办事宜列表后，**先点一次「等待」再观察**。
         ⚠️ 这个列表是**异步渲染**的：第一次观察常常只看到搜索框、页签和
         左边那一列分组，**看不到流程行**。看到那种画面就**再点一次「等待」**
         （最多两次），流程行就会出现。**不要**在那时去点别的东西。
         ⚠️ 【绝对不要点这两处】
         · **左边那一列里任何条目都不要点**——那一列是**筛选器**
           （按流程模板分组、或「已归档」「我的待办」这类分类），
           **都不是流程实例**。要点的那条在**右边那一列**：
           每行一个标题，右边还带「创建人」「创建日期」。
           实测（2026-10-09）模型先后点过带计数的分组、以及「已归档」，
           两次都点错并空转到步数上限。
         · 「全部」「待处理」「待阅」这些**页签**——列表本就停在「待处理」上，
           点它们只会让列表重新加载。
         ⚠️ **页面上任何搜索框都不要用**（尤其是顶栏那个带放大镜的
         「请输入关键词搜索」）——那是**全站**搜索，实测搜出来永远是「没有数据」，
         而你要找的流程**就在下面这个列表里**。
      2. 在列表里找到标题**与「{{ wf_request_name }}」逐字完全一致**的那条流程，点开它。
         ⚠️ 标题必须与上面那串**逐字完全一致**——实测（2026-10-09）曾挑了
         「前缀相同、后半段不同」的另一条，整条用例走进了别人的流程而失败。
         ⚠️ **列表里会同时有名字极像的两类标题，先分清再点**：
         · **系统自动生成的**，形如「UI自动化流程提交-AutoTest001-2026-10-09」
           ——流程名和后半段之间是**连字符 `-`**，别点这种；
         · **要你找的那条**，形如「{{ wf_request_name }}」——它是**纯英文字母开头的**、
           与上面那种中文标题**完全不同**。**只点这一条。**
         ⚠️ 上面那个形状是**变量渲染出来的真实名字**，逐字对上再点。

         ⚠️ **列表里会同时有名字极像的两类标题，先分清再点**：
         · **系统自动生成的**，形如「UI自动化流程提交-AutoTest001-2026-10-09」
           ——流程名和后半段之间是**连字符 `-`**，别点这种；
         · **要你找的那条**，形如「{{ wf_request_name }}」——它是**纯英文字母开头的**、
           与上面那种中文标题**完全不同**。**只点这一条。**
         ⚠️ 上面那个形状是**变量渲染出来的真实名字**，逐字对上再点。

      3. 表单打开后，在表单里找到「签字意见」输入框，输入「同意流程」。
      4. 找到并点击**「提 交」按钮**提交它（按钮文字中间带一个空格，按语义找它）。
         ⚠️ **按钮在表单的右上角那一排**：「提 交」「保 存」「转 发」三个并排。
         ⚠️ **不要点「批 准」「同 意」这类词**——那是签字意见框旁边的
         **常用批示语**，点它只会往签字意见里填两个字，**流程不会被提交**。
         实测（2026-10-09）模型点了「批 准」就以为提交完了，结果表单还开着、
         流程一动不动。
         ⚠️ 也不要点「保 存」——保存只会把草稿留着，流程不动。
      5. 提交成功后表单页会关闭，回到待办事宜列表。
      6. 回到列表后，看清楚这条流程**还在不在**你的待办里。
      7. 确认过之后停止，不要去做别的操作。

      【完成条件】终局页面是「待办事宜」列表，且里面**已经找不到**这条流程
      （提交成功后它就从我的待办里转走了）。

      【本用例测不到的部分，说清楚】源用例 TC03 的核心是"会签要两人都提交才流转到审批3"。
      那需要同时观察人员03 的待办与流程当前节点，**而一条 UI 用例只有一个登录身份**，
      看不见别人的待办。所以这里只验证"人员02 自己这一份提交成功、离开了自己的待办"；
      "两人齐才流转"由 setup: wf-approval3 那条用例的前置（接口按会签语义推进）间接覆盖。
    expect_mode: and
    expect:
      # 确定性：回到待办事宜列表 = 表单页关了 = 提交真的生效了
      # （提交失败时表单会留在原地不关，所以这一条本身就是"提交成功"的正向证据）
      - type: url_contains
        value: "/main/workflow/listDoing"
      # 确定性：提交成功后它不该再出现在我的待办里。名字是逐用例唯一的，
      # 不会误判别人那条（注意：不能用 {{ run_id }} 代替——同一轮里别的用例
      # 建出来的实例也带同一个 run_id，会互相干扰）。
      # ⚠️ 前提：goal 让模型**先用搜索把列表筛成只剩这一条**。不筛的话这条会**假通过**——
      #   `snapshot` 的页面文本只收录**视口内**的文字，而列表是 10 条/页分页的，
      #   目标被挤到第 2 页时"页面上找不到它"就恒真了（实测 2026-10-09 踩过）。
      - type: text_not_contains
        value: "{{ wf_request_name }}"
      # 语义：正面陈述页面身份（负向措辞实测只有 ~0.47，见 AGENTS.md）
      - type: ai
        desc: 回到待办事宜列表
        claim: 当前页面是待办事宜列表

  # ── TC04 审批3 非会签：人员04 提交即流转 ──────────────────────────────────
