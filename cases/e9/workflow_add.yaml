# E9 新建流程用例。
#
# 这是框架的第一条真实业务用例，对应「跳转新建流程页 → 点流程类型 → 填签字意见 → 提交」。
# url 与 goal 只描述"做什么"，不写站点专用步骤脚本；具体元素的定位由
# snapshot.js 从真实 DOM 观测得出，模型只在观测到的候选里选。
version: 1

defaults:
  login: employee1
  epic: E9-UI自动化
  feature: 流程管理
  severity: critical
  timeout_s: 420
  max_steps: 30

cases:
  - id: e9-workflow-add-bym
    name: 新建 BYM专用测试 流程并提交
    tags: [e9, workflow, smoke]
    login: employee1
    url: "{{ base_url }}/wui/index.html#/main/workflow/add"
    # 停止条件必须写成可观察的判据（2026-09-29 实测）：模型点完「提交」就判 DONE
    # （首次实测置信仅 0.61），而表单页根本没关闭、URL 仍在 static4form——**断言是对的，
    # 是 agent 提前收工**。当天两次全量跑都是同一机制（3 个动作 / 4 次决策 / done）。
    # 所以这里显式禁止"表单还开着就选 DONE"，并给出"什么才算完成"的判据。
    goal: |
      在 E9 里新建一个「BYM专用测试」流程并提交：
      1. 打开新建流程页面，页面上按分组列出了各种流程名称；
      2. 在流程列表里点击「BYM专用测试」，它会打开该流程的表单页面；
      3. 在表单里找到「签字意见」输入框，输入「同意流程」；
      4. 点击「提交」按钮提交该流程。

      【完成条件：点完「提交」还不算完成】提交成功后表单页会自动关闭、回到新建流程列表页。
      所以点完「提交」之后要继续观察页面，按下面两条判据决定停不停：
        · 还能看到「提 交」「保 存」「流转设定」这些表单页上的按钮与页签 → 表单还开着、
          提交还没生效；继续观察（必要时用「等待」），**不要停止**；
        · 表单页已经关闭、重新看到按分组排列的流程名称列表 → 这才算完成，此时停止。
      **表单页还开着的时候不要选 DONE。**
    expect_mode: and
    expect:
      # 语义断言：由 Jev 的 noul 给出概率，阈值比较留在代码里（默认 0.75）。
      # 措辞要【正面、具体】：实测否定式表述（"已经关闭，不在表单上"）只得到 0.47，
      # 而正面陈述同一事实能得到 0.9+。断言写得原子、正向，比调阈值有效得多。
      #
      # ⚠️ **这句量过两轮，别改回"是哪个页面"的说法**（2026-10-10，用真实终局页面，
      # 见 artifacts/probe/measure_bym_claims.py）：
      #   · 旧措辞「页面上显示的是新建流程的流程名称列表」——页面身份类，
      #     正页 **0.590**（贴线红；全量跑里实测 0.46 / 0.73 / 0.74 一直飘）
      #   · 现措辞（与 TC01/TC02 同页面同款）——正页 **0.970**、否页 **0.040**
      # 两轮都量了**否页**（提交没生效、表单还开着时的页面）：好措辞必须在那上面
      # **判不过**，否则形同虚设——"表单还开着"会被当成"回到了列表"。
      - type: ai
        desc: 已回到流程名称列表页
        claim: 页面上显示着按分组排列的流程名称列表
      # 确定性断言：表单页的「流转设定」按钮消失，说明已离开表单
      - type: text_not_contains
        value: "流转设定"
      # 确定性断言：回到新建流程列表页
      - type: url_contains
        value: "/wui/index.html#/main/workflow/add"